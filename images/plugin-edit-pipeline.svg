<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 906" width="440" height="906" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">What happens on every edit</title><desc id="d">Every edit runs Start, Edit, Check, and Ship a Draft automatically. The only stop is the writer's approval. If yes, it publishes and reports; if no, the change stays a Draft that can be rolled back.</desc>
<rect width="440" height="906" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<text x="20" y="36" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">What happens on every edit</text><rect x="20" y="66" width="400" height="92" rx="10" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="98" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">1. Start</text><text x="36" y="122" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Find the article from any link and check</text><text x="36" y="142" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">that nobody else is editing it</text><line x1="220.0" y1="160" x2="220.0" y2="182" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/><rect x="20" y="186" width="400" height="92" rx="10" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="218" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">2. Edit</text><text x="36" y="242" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Make the change, then review the whole</text><text x="36" y="262" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">article for brand and style</text><line x1="220.0" y1="280" x2="220.0" y2="302" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/><rect x="20" y="306" width="400" height="92" rx="10" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="338" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">3. Check</text><text x="36" y="362" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Standards audit: headings, sentence case,</text><text x="36" y="382" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">links, alt text</text><line x1="220.0" y1="400" x2="220.0" y2="422" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/><rect x="20" y="426" width="400" height="92" rx="10" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="458" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">4. Ship a Draft</text><text x="36" y="482" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Save with an author note, then re-read the</text><text x="36" y="502" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Draft and the live version</text><line x1="220.0" y1="520" x2="220.0" y2="542" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/><polygon points="220.0,546 390.0,600 220.0,654 50.0,600" fill="#fff7e6" stroke="#b45309" stroke-width="2"/><text x="220.0" y="596" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Writer says yes?</text><text x="220.0" y="620" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="middle">The one human approval</text><text x="398.0" y="590" font-size="15" font-weight="600" fill="#4a4a4a" text-anchor="start">No</text><path d="M390.0,600 L410,600 L410,688" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="220.0" y1="656" x2="220.0" y2="690" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/><text x="228.0" y="678" font-size="15" font-weight="600" fill="#4a4a4a" text-anchor="start">Yes</text><rect x="20" y="694" width="250" height="72" rx="10" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="726" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">5. Publish</text><text x="36" y="750" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Live on the help site</text><rect x="282" y="694" width="138" height="72" rx="10" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="296" y="726" font-size="16" font-weight="650" fill="#1a1a1a" text-anchor="start">Stays a Draft</text><text x="296" y="750" font-size="14" font-weight="400" fill="#4a4a4a" text-anchor="start">Roll back anytime</text><line x1="145" y1="768" x2="145" y2="790" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/><rect x="20" y="794" width="400" height="92" rx="10" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="826" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">6. Report</text><text x="36" y="850" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">One before/after table; the SME gets the</text><text x="36" y="870" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">link and the ticket closes</text>
</svg>