<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 911" width="440" height="911" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How it got built, March to October 2026</title><desc id="d">March 2026 direct API integration; May safety rules agreed; June production API access pulled; July direct MCP connection; August production live; September team plugin; September 29 notice that the old connection ends October 31, moved to the new access layer the next day; October joined Intuit's plugin registry with 150+ articles updated in the first week.</desc>
<rect width="440" height="911" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<line x1="78" y1="78" x2="78" y2="794" stroke="#d1d5db" stroke-width="3"/><text x="20" y="36" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">March to October 2026</text><text x="60" y="84" font-size="14" font-weight="700" fill="#4a4a4a" text-anchor="end">Mar</text><text x="100" y="84" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">Pitched and built a direct API</text><text x="100" y="105" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">integration</text><text x="100" y="128" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Edits drop from 3–5 minutes to about 30</text><text x="100" y="147" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">seconds</text><text x="60" y="198" font-size="14" font-weight="700" fill="#4a4a4a" text-anchor="end">May</text><text x="100" y="198" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">Agreed safety rules with the CMS</text><text x="100" y="219" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">team</text><text x="100" y="242" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Drafts only, manual publish, edit-lock</text><text x="100" y="261" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">checks</text><text x="60" y="312" font-size="14" font-weight="700" fill="#4a4a4a" text-anchor="end">Jun</text><text x="100" y="312" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">Production API access pulled</text><text x="100" y="335" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">I pushed back and wrote the requirements</text><text x="100" y="354" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">for a replacement</text><text x="60" y="405" font-size="14" font-weight="700" fill="#4a4a4a" text-anchor="end">Jul</text><text x="100" y="405" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">Connected straight to the new MCP</text><text x="100" y="426" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">server</text><text x="100" y="449" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Worked through the sign-in chain and</text><text x="100" y="468" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">platform bugs</text><text x="60" y="519" font-size="14" font-weight="700" fill="#4a4a4a" text-anchor="end">Aug</text><text x="100" y="519" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">Production live, team pilot passes</text><text x="100" y="542" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">First verified production publish on day</text><text x="100" y="561" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">one</text><text x="60" y="612" font-size="14" font-weight="700" fill="#4a4a4a" text-anchor="end">Sep</text><text x="100" y="612" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">Packaged as a self-updating team</text><text x="100" y="633" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">plugin</text><text x="100" y="656" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">8-step edit flow becomes one command</text><text x="60" y="707" font-size="14" font-weight="700" fill="#4a4a4a" text-anchor="end">Sep 29</text><text x="100" y="707" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">Old connection to end Oct 31</text><text x="100" y="730" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Moved to Intuit's new access layer the</text><text x="100" y="749" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">next day</text><text x="60" y="800" font-size="14" font-weight="700" fill="#4a4a4a" text-anchor="end">Oct</text><text x="100" y="800" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">Joined Intuit's internal plugin</text><text x="100" y="821" font-size="16.5" font-weight="650" fill="#1a1a1a" text-anchor="start">registry</text><text x="100" y="844" font-size="14.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Team rollout: 150+ articles in week one</text><circle cx="78" cy="79" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="78" cy="193" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="78" cy="307" r="8" fill="#fff" stroke="#b45309" stroke-width="3"/><circle cx="78" cy="400" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="78" cy="514" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="78" cy="607" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="78" cy="702" r="8" fill="#fff" stroke="#b45309" stroke-width="3"/><circle cx="78" cy="795" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="28" cy="887" r="7" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="42" y="892" font-size="14" font-weight="500" fill="#4a4a4a" text-anchor="start">Progress</text><circle cx="138" cy="887" r="7" fill="#fff" stroke="#b45309" stroke-width="3"/><text x="152" y="892" font-size="14" font-weight="500" fill="#4a4a4a" text-anchor="start">Setback or forced change</text>
</svg>