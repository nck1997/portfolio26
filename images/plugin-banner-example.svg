<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 772.1" width="440" height="772.1" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Adding one banner to 25 articles</title><desc id="d">By hand, a writer builds a reusable block and inserts it into 25 articles one at a time, about 75 to 125 minutes. With the plugin, one request produces 25 verified Drafts and one approval publishes them, about 12 minutes.</desc>
<rect width="440" height="772.1" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<text x="20" y="36" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">Adding one banner to 25 articles</text><text x="20" y="64.0" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Same change, two ways. Times use the team's</text><text x="20" y="83.5" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">measured per-edit averages.</text><text x="20" y="131.0" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start">By hand</text><rect x="20" y="145.0" width="400" height="39" rx="8" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="171.0" font-size="15.5" font-weight="500" fill="#1a1a1a" text-anchor="start">Build a reusable block for the banner</text><rect x="20" y="194.0" width="400" height="39" rx="8" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="220.0" font-size="15.5" font-weight="500" fill="#1a1a1a" text-anchor="start">Open article 1, insert the block, save</text><rect x="20" y="243.0" width="400" height="39" rx="8" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="269.0" font-size="15.5" font-weight="500" fill="#1a1a1a" text-anchor="start">Repeat for articles 2 through 25</text><rect x="20" y="292.0" width="400" height="39" rx="8" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="318.0" font-size="15.5" font-weight="500" fill="#1a1a1a" text-anchor="start">Spot-check each one for mistakes</text><text x="20" y="363.0" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">With the plugin</text><rect x="20" y="377.0" width="400" height="39" rx="8" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="403.0" font-size="15.5" font-weight="500" fill="#1a1a1a" text-anchor="start">"Add this banner to these 25 articles"</text><rect x="20" y="426.0" width="400" height="60" rx="8" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="452.0" font-size="15.5" font-weight="500" fill="#1a1a1a" text-anchor="start">25 Drafts saved and verified, with one</text><text x="36" y="473.0" font-size="15.5" font-weight="500" fill="#1a1a1a" text-anchor="start">report</text><rect x="20" y="496.0" width="400" height="39" rx="8" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="522.0" font-size="15.5" font-weight="500" fill="#1a1a1a" text-anchor="start">One yes from the writer, then it publishes</text><text x="20" y="569.0" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start">Editing time for 25 articles</text><text x="20" y="601.0" font-size="15" font-weight="600" fill="#1a1a1a" text-anchor="start">By hand</text><rect x="20" y="611.0" width="400" height="26" rx="4" fill="#d1d5db"/><rect x="20" y="611.0" width="240.0" height="26" rx="4" fill="#9ca3af"/><text x="412" y="630.0" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="end">75–125 min</text><text x="20" y="667.0" font-size="15" font-weight="600" fill="#1a1a1a" text-anchor="start">With the plugin</text><rect x="20" y="677.0" width="40.0" height="26" rx="4" fill="#2563eb"/><text x="68.0" y="696.0" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start">about 12 min</text><text x="20" y="725.0" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">By hand is 3 to 5 minutes per article. The plugin</text><text x="20" y="742.55" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">averages about 30 seconds.</text>
</svg>