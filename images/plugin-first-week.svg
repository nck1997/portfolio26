<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 472.1" width="440" height="472.1" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Articles updated in a week</title><desc id="d">A typical week the whole team updates about 50 articles by hand. In the first week with the plugin, three of five writers updated 150 or more, about three times the usual volume.</desc>
<rect width="440" height="472.1" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<text x="20" y="36" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">Articles updated in a week</text><text x="20" y="64.0" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Confirmed plugin edits only, before content</text><text x="20" y="83.5" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">refresh season.</text><line x1="56" y1="347.0" x2="424" y2="347.0" stroke="#eef0f3" stroke-width="1"/><text x="48" y="352.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">0</text><line x1="56" y1="284.5" x2="424" y2="284.5" stroke="#eef0f3" stroke-width="1"/><text x="48" y="289.5" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">50</text><line x1="56" y1="222.0" x2="424" y2="222.0" stroke="#eef0f3" stroke-width="1"/><text x="48" y="227.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">100</text><line x1="56" y1="159.5" x2="424" y2="159.5" stroke="#eef0f3" stroke-width="1"/><text x="48" y="164.5" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">150</text><path d="M80,347.0 L80,288.5 Q80,284.5 84,284.5 L196,284.5 Q200,284.5 200,288.5 L200,347.0 Z" fill="#9ca3af"/><text x="140.0" y="272.5" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">~50</text><text x="140.0" y="373.0" font-size="15.5" font-weight="650" fill="#1a1a1a" text-anchor="middle">Typical week</text><text x="140.0" y="394.0" font-size="14" font-weight="400" fill="#4a4a4a" text-anchor="middle">whole team, by hand</text><path d="M262,347.0 L262,163.5 Q262,159.5 266,159.5 L378,159.5 Q382,159.5 382,163.5 L382,347.0 Z" fill="#2563eb"/><text x="322.0" y="147.5" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">150+</text><text x="322.0" y="373.0" font-size="15.5" font-weight="650" fill="#1a1a1a" text-anchor="middle">First week</text><text x="322.0" y="394.0" font-size="14" font-weight="400" fill="#4a4a4a" text-anchor="middle">3 of 5 writers</text><line x1="56" y1="347.0" x2="424" y2="347.0" stroke="#6b7280" stroke-width="1.5"/><text x="20" y="431.0" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">About 3x the usual weekly volume, from three of the</text><text x="20" y="448.55" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">team's five writers.</text>
