<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 938" width="440" height="938" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Where the plugin sits</title><desc id="d">A writer asks Claude in plain English. The authoring plugin and edit pipeline, which Nischal built, turn the request into a verified Draft. Calls go through Intuit's desktop access layer, signed as the writer, to the content MCP server and the content system, and WordPress mirrors the result.</desc>
<rect width="440" height="938" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<text x="20" y="36" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start">Where the plugin sits</text><rect x="20" y="60" width="16" height="16" rx="3" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="44" y="74" font-size="15" font-weight="500" fill="#4a4a4a" text-anchor="start">What I built</text><rect x="160" y="60" width="16" height="16" rx="3" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="184" y="74" font-size="15" font-weight="500" fill="#4a4a4a" text-anchor="start">Existing Intuit systems</text><rect x="20" y="94" width="400" height="92" rx="10" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="126" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">A writer in Claude</text><text x="36" y="150" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Asks in plain English, like "work this Jira</text><text x="36" y="170" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">ticket"</text><line x1="220.0" y1="188" x2="220.0" y2="212" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="216" width="400" height="92" rx="10" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="248" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">The authoring plugin</text><text x="36" y="272" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Picks the right skill: edit, bulk, refresh,</text><text x="36" y="292" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">or images</text><line x1="220.0" y1="310" x2="220.0" y2="334" stroke="#2563eb" stroke-width="2" marker-end="url(#ahb)"/><rect x="20" y="338" width="400" height="92" rx="10" fill="#eef3fe" stroke="#2563eb" stroke-width="2"/><text x="36" y="370" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">The edit pipeline</text><text x="36" y="394" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Builds the change, checks standards, saves a</text><text x="36" y="414" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Draft, and verifies it</text><line x1="220.0" y1="432" x2="220.0" y2="456" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="460" width="400" height="92" rx="10" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="492" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">Intuit's desktop access layer</text><text x="36" y="516" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Signs every call as that writer, so there</text><text x="36" y="536" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">are no shared keys</text><line x1="220.0" y1="554" x2="220.0" y2="578" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="582" width="400" height="92" rx="10" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="614" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">Content MCP server</text><text x="36" y="638" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">Built by the CMS team after the API route</text><text x="36" y="658" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">closed</text><line x1="220.0" y1="676" x2="220.0" y2="700" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="704" width="400" height="92" rx="10" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="736" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">Content system</text><text x="36" y="760" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">The source of truth, with Draft and Live</text><text x="36" y="780" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">versions</text><line x1="220.0" y1="798" x2="220.0" y2="822" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="826" width="400" height="92" rx="10" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="36" y="858" font-size="18" font-weight="650" fill="#1a1a1a" text-anchor="start">WordPress editor</text><text x="36" y="882" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">A mirror the plugin refreshes after each</text><text x="36" y="902" font-size="15" font-weight="400" fill="#4a4a4a" text-anchor="start">change</text>
</svg>